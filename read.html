<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read &amp; zoom — Notizie diverse</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="nav"></div>

<div class="thumbstrip" id="thumbs"></div>

<div class="reader">
  <div id="osd"></div>
  <div class="txtpane">
    <div class="readerbar">
      <button class="nbtn" id="prev" title="previous leaf">‹</button>
      <button class="nbtn" id="next" title="next leaf">›</button>
      <select id="jump"></select>
      <span class="seg" style="margin-left:auto">
        <button data-mode="dipl">Diplomatic</button>
        <button data-mode="transl">English</button>
        <button data-mode="both" class="on">Both</button>
      </span>
    </div>
    <div class="pad" id="content"><div class="loading">loading…</div></div>
  </div>
</div>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/openseadragon@4.1.0/build/openseadragon/openseadragon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/read.js"></script>
</body>
</html>
